name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk WorkApp_v0.5.0.apk
      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0-test
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: WorkApp_v0.5.0.apk
          name: 나인패밀리 v0.5.0 시험판
          body: "일정 앞으로, 실적은 전체로, 채팅, 재고, 가맹점, 계약, 사용설명서"
