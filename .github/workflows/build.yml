name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk WorkApp_v0.3.1.apk
      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.1-test
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: WorkApp_v0.3.1.apk
          name: 나인패밀리 v0.3.1 시험판
          body: 폴드·태블릿 넓은 화면 대응, 로그인 유지, 앱 아이콘 적용. 이 폰 안에만 저장되는 시험판.
