name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk WorkApp_v0.1.apk
      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1-test
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: WorkApp_v0.1.apk
          name: 사내 업무앱 v0.1 시험판
          body: 이 폰 안에만 저장되는 시험판입니다. 서버 연결 전 화면과 흐름 확인용.
