name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk WorkApp_v0.4.0.apk
      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.0-test
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: WorkApp_v0.4.0.apk
          name: 나인패밀리 v0.4.0 시험판
          body: 서버(Firebase) 연결 시험판: 휴대폰 문자 인증 로그인, 실시간 저장.
